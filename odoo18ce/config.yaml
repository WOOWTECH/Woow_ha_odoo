---
name: "Odoo 18 CE"
description: "Odoo 18 Community Edition + PostgreSQL 16 — bundled all-in-one add-on for SME"
version: "0.2.0"
slug: "odoo18ce"
url: "https://github.com/WOOWTECH/Woow_odoo_docker_compose_all"
startup: application
boot: auto
init: false

arch:
  - amd64
  - aarch64

ports:
  8069/tcp: 8069
  8072/tcp: 8072

ports_description:
  8069/tcp: "Odoo Web + XML-RPC"
  8072/tcp: "Odoo Longpolling / WebSocket"

webui: "http://[HOST]:[PORT:8069]"

map:
  - share:rw
  - backup:rw
  - addon_config:rw

backup: cold
backup_exclude:
  - "**/cache"
  - "**/logs"
  - "**/sessions"

# ---------- options schema (22 fields) ----------
schema:
  # Required
  admin_passwd: "password"
  db_password: "password"

  # System
  TZ: "str?"

  # Database
  default_db: "str?"
  list_db: "bool?"

  # Performance
  workers: "int(0,16)?"
  max_cron_threads: "int(0,4)?"
  limit_memory_hard: "int?"
  limit_memory_soft: "int?"
  limit_time_cpu: "int?"
  limit_time_real: "int?"

  # Network
  proxy_mode: "bool?"

  # Modules
  odoo_extra_addons: "str?"
  auto_update_module: "str?"
  without_demo: "bool?"

  # Developer
  dev_mode: "bool?"
  log_level: "list(info|debug|warn|error|critical)?"

  # SMTP (all optional)
  email_from: "str?"
  smtp_server: "str?"
  smtp_port: "int?"
  smtp_user: "str?"
  smtp_password: "password?"
  smtp_ssl: "bool?"

options:
  TZ: "Asia/Taipei"
  list_db: true
  workers: 0
  max_cron_threads: 1
  limit_memory_hard: 2684354560
  limit_memory_soft: 2147483648
  limit_time_cpu: 60
  limit_time_real: 120
  proxy_mode: true
  dev_mode: false
  log_level: "info"
  without_demo: true
  odoo_extra_addons: ""
  auto_update_module: ""
  default_db: ""
  email_from: ""
  smtp_server: ""
  smtp_port: 465
  smtp_user: ""
  smtp_password: ""
  smtp_ssl: true
