# DL3008 asks for apt version pins. On a Debian base that tracks security
# updates this pins us to packages that stop existing; the Odoo package, the
# one artefact whose exact build matters, is pinned by version and SHA256.
#
# DL3006 (a tag on FROM) is not ignored any more: since issue #124 the
# Dockerfile's own `ARG BASE_IMAGE_TAG` carries the dated tag, and hadolint
# accepts a FROM composed from ARGs that are declared above it.
ignored:
  - DL3008
