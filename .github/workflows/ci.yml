---
name: CI

# The PR gate. Every pull request and every push to main runs the linters,
# the static test tier and an amd64 image build. A pull request that bumps
# the add-on version also has to build aarch64, because the moment it merges
# users who added this repository directly will try to pull that version.
#
# The live tier (Playwright against a deployed Odoo) never runs here; the
# perimeter workflow is the one read-only exception.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ADDON_DIR: odoo18ce

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Line endings are LF in the index
        run: |
          set -euo pipefail
          if git ls-files --eol | grep -E '^i/(crlf|mixed)'; then
            echo "::error::CRLF line endings are committed; see .gitattributes"
            exit 1
          fi

      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ env.ADDON_DIR }}/Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      - name: shellcheck
        run: |
          set -euo pipefail
          # The rootfs scripts use the bashio shebang, which shellcheck cannot
          # infer a dialect from, so the dialect is given explicitly.
          mapfile -t scripts < <(
            find "${ADDON_DIR}/rootfs/etc/cont-init.d" "${ADDON_DIR}/rootfs/etc/services.d" -type f
            echo "${ADDON_DIR}/rootfs/usr/local/bin/odoo-maintenance-bootstrap"
            echo "${ADDON_DIR}/rootfs/usr/local/bin/odoo-rewrite-apply"
            echo "${ADDON_DIR}/rootfs/usr/local/lib/supervisor-read.sh"
          )
          shellcheck --version | head -2
          shellcheck -s bash -e SC1008 "${scripts[@]}"

      - name: yamllint
        run: |
          set -euo pipefail
          pip install --quiet yamllint
          # Warnings (line length) are reported but do not fail the gate;
          # errors (syntax, indentation, truthy values) do.
          yamllint -f github .

      - name: Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ env.ADDON_DIR }}

  static:
    name: static
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Enough history to compare the version against the base of a PR
          # or the previous commit of a push.
          fetch-depth: 0

      - name: Detect a version bump
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
          fi
          current="$(yq -r '.version' "${ADDON_DIR}/config.yaml")"
          previous="$(git show "${base}:${ADDON_DIR}/config.yaml" 2>/dev/null \
            | yq -r '.version' || echo unknown)"
          echo "version=${current}" >> "$GITHUB_OUTPUT"
          if [ "${current}" != "${previous}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::version bump ${previous} -> ${current}: aarch64 build required," \
              "Unreleased CHANGELOG section forbidden"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.ADDON_DIR }}/tests/requirements-test.txt

      - name: Install nginx and test requirements
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx-core
          sudo systemctl stop nginx || true
          pip install --quiet -r "${ADDON_DIR}/tests/requirements-test.txt"
          nginx -v
          node --version

      - name: Static tier
        env:
          CI: "true"
          RELEASE_CHECK_STRICT: ${{ steps.version.outputs.changed == 'true' && '1' || '0' }}
        run: pytest -q "${ADDON_DIR}/tests"

  # amd64 on every PR; aarch64 only when the version changes. A skipped job
  # counts as passed for the required checks, so both can be required. Two
  # jobs rather than a matrix because a job-level `if` cannot see `matrix`.
  build-amd64:
    name: build (amd64)
    needs: static
    runs-on: ubuntu-latest
    # The guard probe below starts Odoo in the built image. A nightly that
    # makes `odoo shell` wait on something would otherwise hold this job for
    # GitHub's 360-minute default (issue #121). Each probe run is cut at
    # 300 s; the rest is headroom for a build with a cold cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The base image and its tag come from the Dockerfile's own ARGs;
      # only the architecture is passed in (issue #124).
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.ADDON_DIR }}
          push: false
          # Loaded into the local daemon so the step below can run the
          # image; without this the build only fills the cache.
          load: true
          build-args: |
            BUILD_ARCH=amd64
          tags: woow-ha-odoo-amd64:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      # The Static tier cannot see inside the image, which is why the
      # missing YAML reader lived until somebody ran the Rewrite scan on a
      # host (ADR 0008). This runs the shipped code in the shipped image:
      # the apply module imports, and it reads the shipped exception list.
      - name: In-image contract (Rewrite scan)
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python3 woow-ha-odoo-amd64:ci \
            /usr/local/lib/rewrite_apply.py --help > /dev/null
          docker run --rm --entrypoint python3 woow-ha-odoo-amd64:ci -c '
          import sys
          sys.path.insert(0, "/usr/local/lib")
          import rewrite_apply
          exceptions = rewrite_apply.load_exceptions()
          assert exceptions, "the shipped exception list read as empty"
          print(f"exception list: {len(exceptions)} entries")
          '

      # Odoo refuses to install a module whose external_dependencies it
      # cannot find, and it looks them up by PyPI distribution name first.
      # WOOWTECH's ECPay e-invoice module (ecpay_odoo18) declares
      # pycryptodomex and imports Cryptodome (issue #141), so both are asked
      # the way Odoo asks them, through Odoo's own check.
      - name: In-image contract (external Python dependencies)
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python3 woow-ha-odoo-amd64:ci -c '
          from odoo.modules.module import check_python_external_dependency
          for dependency in ("pycryptodomex", "cryptography", "requests"):
              check_python_external_dependency(dependency)
              print(f"external dependency: {dependency} ok")
          import Cryptodome.Cipher.AES
          '

      # woow_base_url_guard raises ImportError when an Odoo nightly moves
      # res.users.authenticate, but Odoo's server-wide loader only logs that
      # and serves unguarded, and the Static tier tests the guard against a
      # stand-in that never moves (issue #88). So Odoo in this image loads
      # the server-wide modules the add-on renders, and the probe asks it
      # whether the last authenticate declared in its res_users module (the
      # one the registry runs) carries the guard's flag and whether the
      # wrapper still fits upstream's parameters (issue #121). The second
      # run leaves the guard out of --load and has to come back unguarded,
      # which shows the check can go red. No database, Supervisor or
      # credential is used.
      - name: In-image contract (Canonical URL guard)
        run: |
          set -euo pipefail
          config="${ADDON_DIR}/rootfs/etc/cont-init.d/10-odoo-config.sh"
          modules="$(sed -nE 's/^server_wide_modules = (.+)$/\1/p' "${config}")"
          if [[ ",${modules}," != *,woow_base_url_guard,* ]]; then
            echo "::error::server_wide_modules in ${config} does not name woow_base_url_guard"
            exit 1
          fi
          without_guard="$(tr ',' '\n' <<< "${modules}" | grep -vx woow_base_url_guard | paste -sd,)"

          # Prints the probe's output; the exit status is the container's
          # (124 when the 300 s timeout cut it), for the caller to read. The
          # -k makes sure a docker client that ignores TERM still goes.
          check_guard() {
            timeout -k 30 300 docker run --rm -i --user odoo --entrypoint /usr/bin/odoo woow-ha-odoo-amd64:ci \
              shell --addons-path=/opt/woow-server-addons --load="$1" \
              < "${ADDON_DIR}/tests/in_image/base_url_guard_applied.py" 2>&1
          }

          # The probe always prints a `base-url-guard:` line when it ran at
          # all. None means odoo shell never reached it: that is a container
          # failure, reported as one, not the guard.
          probe_reported() {
            if ! grep -q '^base-url-guard: ' <<< "$1"; then
              echo "::error::odoo shell in the built image exited ${2} before the guard probe" \
                "reported (124 is the 300 s timeout); this is a container failure, not the guard." \
                "Its output is above."
              exit 1
            fi
          }

          status=0
          out="$(check_guard "${modules}")" || status=$?
          echo "${out}"
          probe_reported "${out}" "${status}"
          if grep -q '^base-url-guard: signature mismatch' <<< "${out}"; then
            echo "::error::woow_base_url_guard forwards parameters that upstream's" \
              "res.users.authenticate does not take that way; the guard installs, and a login" \
              "would raise TypeError. The difference is named in the probe line above."
            exit 1
          fi
          if ! grep -qx 'base-url-guard: applied' <<< "${out}"; then
            echo "::error::woow_base_url_guard is not applied to the last res.users.authenticate" \
              "declared in Odoo's res_users module, so Odoo guesses web.base.url from the first" \
              "administrator login. A moved seam shows above as 'Failed to load server-wide module';" \
              "a later res.users class redefining authenticate shows nothing."
            exit 1
          fi

          status=0
          out="$(check_guard "${without_guard}")" || status=$?
          echo "${out}"
          probe_reported "${out}" "${status}"
          if ! grep -qx 'base-url-guard: not applied' <<< "${out}"; then
            echo "::error::the guard check did not report 'not applied' with" \
              "woow_base_url_guard left out of --load=${without_guard}; it cannot go red"
            exit 1
          fi
          echo "mutation: --load=${without_guard} reports the guard not applied, as it must"

  build-aarch64:
    name: build (aarch64)
    needs: static
    if: ${{ needs.static.outputs.version_changed == 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.ADDON_DIR }}
          push: false
          build-args: |
            BUILD_ARCH=aarch64
          tags: woow-ha-odoo-aarch64:ci
          cache-from: type=gha,scope=aarch64
          cache-to: type=gha,scope=aarch64,mode=max
