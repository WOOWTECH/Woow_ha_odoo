---
name: Literal rewrite gate

# Live-tier gate for the Ingress Literal rewrite (issue #58, ADR 0004).
# Logs in to each public origin in ODOO_PUBLIC_URLS with the E2E account,
# collects every asset bundle the backend, Discuss, the website and each
# installed app's landing page load, and fails when a bundle uses a
# root-relative literal in a whole-page navigation whose prefix the nginx
# Literal rewrite does not cover and no checked-in exception excuses.
#
# Same nightly slot as the perimeter check, and by hand. The perimeter
# check stays credential-free; this workflow is the one that logs in.
# A failure means a newly installed app introduced a Prefix escape under
# Ingress: add a Literal rewrite rule in the three quote variants, or record
# an exception with its reason in odoo18ce/tests/literal_rewrite_exceptions.yaml.

on:
  schedule:
    # 05:30 Asia/Taipei, alongside the perimeter check.
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: literal-rewrite-gate
  cancel-in-progress: false

jobs:
  gate:
    name: literal rewrite gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ODOO_PUBLIC_URLS: ${{ vars.ODOO_PUBLIC_URLS }}
      ODOO_TEST_LOGIN: ${{ secrets.ODOO_TEST_LOGIN }}
      ODOO_TEST_PASSWORD: ${{ secrets.ODOO_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Origins and credentials are configured
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${ODOO_PUBLIC_URLS// /}" ]; then
            echo "::error::repository variable ODOO_PUBLIC_URLS is empty; nothing to check"
            missing=1
          fi
          for name in ODOO_TEST_LOGIN ODOO_TEST_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::repository secret ${name} is not set; the gate needs the E2E account to log in"
              missing=1
            fi
          done
          [ "${missing}" -eq 0 ] || exit 1
          echo "origins: ${ODOO_PUBLIC_URLS}"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: odoo18ce/tests/requirements-test.txt

      - name: Install test requirements and Chromium
        run: |
          set -euo pipefail
          pip install --quiet -r odoo18ce/tests/requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Run the gate against each public origin
        run: |
          set -uo pipefail
          status=0
          {
            echo "## Literal rewrite gate"
            echo
            echo "| Origin | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for origin in ${ODOO_PUBLIC_URLS}; do
            host="$(echo "${origin}" | sed -E 's#^[a-z]+://##; s#/.*$##')"
            export ODOO_BASE_URL="${origin}"
            export E2E_ARTIFACT_DIR="artifacts/${host}"
            if python odoo18ce/tests/e2e_literal_rewrite_gate.py > "artifacts-${host}.log" 2>&1; then
              summary="$(grep -E '^summary:' "artifacts-${host}.log" || echo pass)"
              echo "| ${host} | ${summary} |" >> "$GITHUB_STEP_SUMMARY"
              echo "${host}: ok"
            else
              status=1
              echo "| ${host} | **FAILED** |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::${host}: literal rewrite gate failed"
            fi
            # The full report is always useful, pass or fail.
            cat "artifacts-${host}.log"
          done
          exit "${status}"

      - name: Keep the report, bundles and screenshots of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: literal-rewrite-gate-${{ github.run_id }}
          path: |
            artifacts/
            artifacts-*.log
          if-no-files-found: ignore
          retention-days: 14
