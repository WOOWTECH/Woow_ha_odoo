---
name: WOOW addon source notification

# The App Store's publisher workflow (#303). Since Woow_HA_App_Store 26bb83d
# the store takes a Release only from a validated notification each source
# writes to its own `woow-addon-sync` branch. With the registry's
# `ref_policy: release` the notification names the latest Release's tag, and
# only once ci.yml and release.yml have passed on that commit. It never
# writes main. It calls the Store's workflow at @main, so the Store's current
# tooling and registry apply without a change here. When publish writes a new
# notification, notify-store asks the Store to synchronize right away.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: 23 */6 * * *
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: woow-addon-source-notification
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.event != 'pull_request_target' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-publish.yml@main

  # Ask the Store to synchronize now instead of at its next (often hours-late)
  # schedule. Runs only when publish wrote a new notification; the Store
  # re-validates everything, so the dispatch carries no payload.
  notify-store:
    needs: publish
    if: needs.publish.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send woow-addon-ready to the Store
        env:
          GH_TOKEN: ${{ secrets.APP_STORE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=Store not notified::APP_STORE_DISPATCH_TOKEN is not set; the Store takes this version at its next scheduled synchronization."
            exit 0
          fi
          gh api --method POST repos/WOOWTECH/Woow_HA_App_Store/dispatches -f event_type=woow-addon-ready
