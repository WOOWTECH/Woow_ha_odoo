---
name: Odoo nightly bump

# Weekly: find the newest Odoo 18.0 nightly package and the newest dated
# Debian base-image tag, and propose each of them in a pull request of its
# own. The PR gate then proves the image still builds. A human merges them;
# see docs/adr/0002-odoo-nightly-bumps-are-human-merged.md for why neither is
# merged automatically, and its postscript for why they are two pull requests:
# the base image sits below every layer, so a base bump is a full ~700 MiB
# download for every host (issue #153, ADR 0013) and is merged quarterly or
# when a security notice needs it, while an Odoo bump is routine.
#
# Opening the PR with a fine-grained PAT (secret BUMP_PR_TOKEN) is what makes
# the PR gate run on it: events created with GITHUB_TOKEN do not trigger
# workflows. Without the secret the PR is still opened, with a warning, and
# a human must close and reopen it to start CI.

on:
  schedule:
    # Monday 04:00 Asia/Taipei.
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: odoo-bump
  cancel-in-progress: false

env:
  ADDON_DIR: odoo18ce
  NIGHTLY_INDEX: https://nightly.odoo.com/18.0/nightly/deb/

jobs:
  bump:
    name: bump
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Newest Odoo nightly
        id: odoo
        run: |
          set -euo pipefail
          current="$(sed -nE 's/^ARG ODOO_DEB_VERSION="(18\.0\.[0-9]{8})"$/\1/p' "${ADDON_DIR}/Dockerfile")"
          newest="$(curl -fsSL --max-time 60 "${NIGHTLY_INDEX}" \
            | grep -oE 'odoo_18\.0\.[0-9]{8}_all\.deb' | sed -E 's/^odoo_(.*)_all\.deb$/\1/' | sort -u | tail -1)"
          [ -n "${current}" ] && [ -n "${newest}" ]
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "newest=${newest}" >> "$GITHUB_OUTPUT"
          if [ "${newest}" = "${current}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Odoo nightly: ${current} is the newest"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Odoo nightly: ${current} -> ${newest}"
          fi

      - name: Newest dated base-image tag
        id: base
        run: |
          set -euo pipefail
          # One tag for every arch, pinned in the Dockerfile (issue #124);
          # amd64's registry lists the dated tags.
          current="$(sed -nE 's/^ARG BASE_IMAGE_TAG="(bookworm-[0-9]{4}\.[0-9]{2}\.[0-9]+)"$/\1/p' "${ADDON_DIR}/Dockerfile")"
          [ -n "${current}" ]
          repo="home-assistant/amd64-base-debian"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          newest="$(curl -fsS -H "Authorization: Bearer ${token}" "https://ghcr.io/v2/${repo}/tags/list?n=500" \
            | python3 -c '
          import json, re, sys
          tags = [t for t in json.load(sys.stdin)["tags"] if re.fullmatch(r"bookworm-\d{4}\.\d{2}\.\d+", t)]
          tags.sort(key=lambda t: tuple(int(p) for p in t.split("-")[1].split(".")))
          print(tags[-1] if tags else "")
          ')"
          # One line pins both architectures, so a tag that amd64 has and
          # aarch64 does not yet is not a bump: the Release's aarch64 publish
          # would fail on it. Wait for the next week instead.
          if [ -n "${newest}" ] && [ "${newest}" != "${current}" ]; then
            arm_repo="home-assistant/aarch64-base-debian"
            arm_token="$(curl -fsS "https://ghcr.io/token?scope=repository:${arm_repo}:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
            if ! curl -fsS -H "Authorization: Bearer ${arm_token}" "https://ghcr.io/v2/${arm_repo}/tags/list?n=500" \
                | python3 -c 'import json,sys; sys.exit(0 if sys.argv[1] in json.load(sys.stdin)["tags"] else 1)' "${newest}"; then
              echo "::notice::base image: ${newest} exists for amd64 but not for aarch64 yet; keeping ${current}"
              newest="${current}"
            fi
          fi
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "newest=${newest}" >> "$GITHUB_OUTPUT"
          if [ -z "${newest}" ] || [ "${newest}" = "${current}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "base image: ${current} is current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::base image: ${current} -> ${newest}"
          fi

      - name: Nothing to bump
        if: steps.odoo.outputs.changed != 'true' && steps.base.outputs.changed != 'true'
        run: echo "Odoo ${{ steps.odoo.outputs.current }} and base ${{ steps.base.outputs.current }} are both current."

      - name: Which token opens the PRs
        if: steps.odoo.outputs.changed == 'true' || steps.base.outputs.changed == 'true'
        env:
          HAS_TOKEN: ${{ secrets.BUMP_PR_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "${HAS_TOKEN}" != "true" ]; then
            echo "::warning::BUMP_PR_TOKEN is not set; the PRs are opened with GITHUB_TOKEN" \
              "and CI will not start until each is closed and reopened"
          fi

      # The Odoo path: the two ODOO_DEB_* lines and the CHANGELOG, never
      # the base-image tag.

      - name: Pin the new Odoo package
        if: steps.odoo.outputs.changed == 'true'
        env:
          NEWEST: ${{ steps.odoo.outputs.newest }}
        run: |
          set -euo pipefail
          url="${NIGHTLY_INDEX}odoo_${NEWEST}_all.deb"
          echo "downloading ${url}"
          curl -fsSL --max-time 900 "${url}" -o /tmp/odoo.deb
          sha="$(sha256sum /tmp/odoo.deb | cut -d' ' -f1)"
          rm -f /tmp/odoo.deb
          sed -i -E "s/^ARG ODOO_DEB_VERSION=\"18\.0\.[0-9]{8}\"$/ARG ODOO_DEB_VERSION=\"${NEWEST}\"/" "${ADDON_DIR}/Dockerfile"
          sed -i -E "s/^ARG ODOO_DEB_SHA256=\"[0-9a-f]{64}\"$/ARG ODOO_DEB_SHA256=\"${sha}\"/" "${ADDON_DIR}/Dockerfile"
          grep -E '^ARG ODOO_DEB_(VERSION|SHA256)=' "${ADDON_DIR}/Dockerfile"

      - name: Record the Odoo bump under Unreleased
        if: steps.odoo.outputs.changed == 'true'
        env:
          FROM: ${{ steps.odoo.outputs.current }}
          TO: ${{ steps.odoo.outputs.newest }}
        run: |
          set -euo pipefail
          python3 .github/scripts/changelog_unreleased.py "${ADDON_DIR}/CHANGELOG.md" \
            "Odoo nightly package ${FROM} -> ${TO}."
          sed -n '1,14p' "${ADDON_DIR}/CHANGELOG.md"

      - name: Open or update the Odoo pull request
        if: steps.odoo.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BUMP_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/odoo-nightly-bump
          delete-branch: true
          commit-message: |
            chore: bump Odoo nightly to ${{ steps.odoo.outputs.newest }}

            Automated weekly bump. A human decides whether to merge: an Odoo
            nightly can carry a database migration.
          title: "chore: bump Odoo nightly to ${{ steps.odoo.outputs.newest }}"
          body: |
            Weekly automated bump. **Merge is a human decision**: an Odoo nightly can carry a database migration that runs on every user's database at the next Release (ADR-0002).

            | | From | To |
            |---|---|---|
            | Odoo nightly | `${{ steps.odoo.outputs.current }}` | `${{ steps.odoo.outputs.newest }}` |

            The SHA256 in the Dockerfile was computed from the downloaded package. The PR gate builds the image; the entry is recorded under `## Unreleased` in the CHANGELOG and ships with the next Release.

            This pull request touches only the two `ODOO_DEB_*` lines, so the Release that carries it re-sends the Odoo layer and the small ones above it, not the whole image; ADR-0013 holds the measured figures. The Debian base image is bumped separately, in its own `base-image` pull request.

            Before merging, consider a Deploy of the resulting image on the woowtech host first. Closing this PR is fine; the next weekly run opens a fresh one.
          labels: dependencies

      # The base-image path. It has to start from the tree the Odoo path
      # started from, or its pull request would carry the Odoo bump as well.

      - name: Start the base-image path from a clean tree
        if: steps.base.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # create-pull-request commits what it finds to its own branch and
          # leaves the workspace on the branch it started from, so these two
          # files should already be unchanged; restoring them from HEAD --
          # index included -- makes sure. Anything else still dirty would ride
          # along in the base-image pull request, so stop instead.
          git checkout HEAD -- "${ADDON_DIR}/Dockerfile" "${ADDON_DIR}/CHANGELOG.md"
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::the workspace still carries changes the base-image PR must not include"
            exit 1
          fi

      - name: Pin the new base image
        if: steps.base.outputs.changed == 'true'
        env:
          NEWEST: ${{ steps.base.outputs.newest }}
        run: |
          set -euo pipefail
          sed -i -E "s/^ARG BASE_IMAGE_TAG=\"bookworm-[0-9]{4}\.[0-9]{2}\.[0-9]+\"$/ARG BASE_IMAGE_TAG=\"${NEWEST}\"/" "${ADDON_DIR}/Dockerfile"
          # sed exits 0 whether or not it matched; the PR must not claim a
          # bump the Dockerfile does not carry.
          grep -qE "^ARG BASE_IMAGE_TAG=\"${NEWEST}\"$" "${ADDON_DIR}/Dockerfile"
          grep -E '^ARG BASE_IMAGE_TAG=' "${ADDON_DIR}/Dockerfile"

      - name: Record the base-image bump under Unreleased
        if: steps.base.outputs.changed == 'true'
        env:
          FROM: ${{ steps.base.outputs.current }}
          TO: ${{ steps.base.outputs.newest }}
        run: |
          set -euo pipefail
          python3 .github/scripts/changelog_unreleased.py "${ADDON_DIR}/CHANGELOG.md" \
            "Debian base image ${FROM} -> ${TO}."
          sed -n '1,14p' "${ADDON_DIR}/CHANGELOG.md"

      - name: Open or update the base-image pull request
        if: steps.base.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BUMP_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/base-image-bump
          delete-branch: true
          commit-message: |
            chore: bump the Debian base image to ${{ steps.base.outputs.newest }}

            Proposed on its own branch: the base sits below every layer, so
            this rebuilds all of them and the Release that carries it is a
            full download for every user (#153).
          title: "chore: bump the Debian base image to ${{ steps.base.outputs.newest }}"
          body: |
            The Home Assistant Debian base image has a newer dated tag. **Merge is a human decision** (ADR-0002), and this bump is proposed on its own, away from the weekly Odoo pin, because of what merging it costs.

            | | From | To |
            |---|---|---|
            | Base image | `${{ steps.base.outputs.current }}` | `${{ steps.base.outputs.newest }}` |

            The base sits below every other layer, so changing it rebuilds every layer: the Release that carries this is a **full download of the whole image — about 700 MiB — for every user**, on both architectures. That download is the #153 failure, and keeping it out of a routine Odoo bump is why ADR-0013 splits the two.

            **Cadence: merge this quarterly, or sooner when the new base carries a security fix.** Leaving it open is the normal state — this same pull request is rewritten in place whenever a newer tag appears, so there is never a second one — and closing it is fine too: a later run opens a fresh one.

            The PR gate builds the image; the entry is recorded under `## Unreleased` in the CHANGELOG and ships with the next Release. Before merging, consider a Deploy of the resulting image on the woowtech host first, and tell users on a slow link what is coming (`docs/runbooks/slow-link-pull.sh`).
          labels: base-image
