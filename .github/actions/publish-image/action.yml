---
name: Publish add-on image
description: >-
  Build one architecture of the add-on image and push it to GHCR under an
  immutable version tag. Shared by the amd64 and aarch64 jobs of release.yml.

inputs:
  arch:
    description: Home Assistant architecture name (amd64 or aarch64)
    required: true
  version:
    description: Add-on version; becomes the only image tag
    required: true
  image_base:
    description: Image name without the -{arch} suffix
    required: true
  addon_dir:
    description: Directory holding config.yaml and the Dockerfile
    required: true
  registry_token:
    description: Token with packages:write for ghcr.io
    required: true

runs:
  using: composite
  steps:
    - name: Read add-on metadata
      id: meta
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        ADDON_DIR: ${{ inputs.addon_dir }}
      run: |
        set -euo pipefail
        {
          echo "name=$(yq -r '.name' "${ADDON_DIR}/config.yaml")"
          echo "description=$(yq -r '.description' "${ADDON_DIR}/config.yaml")"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } >> "$GITHUB_OUTPUT"

    # The BuildKit version is pinned: its defaults decide how a layer is
    # built and compressed, so an upgrade underneath us would change every
    # digest and every host would download the whole image again. Bumping
    # it is a deliberate change with exactly that cost (issue #155).
    - uses: docker/setup-buildx-action@v4
      with:
        driver-opts: image=moby/buildkit:v0.33.0

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry_token }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.addon_dir }}
        # The image output pins gzip rather than taking BuildKit's default,
        # for the same reason the BuildKit version is pinned above: the
        # compression decides the layer bytes, so changing it rebuilds every
        # layer and costs every host a full download (issue #155).
        outputs: type=image,push=true,compression=gzip
        # Supervisor cannot pull an image whose tag points at an attestation
        # manifest list; keep the tag a plain single-platform image.
        provenance: false
        tags: ${{ inputs.image_base }}-${{ inputs.arch }}:${{ inputs.version }}
        # The base image and its tag are the Dockerfile's own ARGs; the
        # architecture selects which one (issue #124).
        build-args: |
          BUILD_ARCH=${{ inputs.arch }}
          BUILD_VERSION=${{ inputs.version }}
          BUILD_DATE=${{ steps.meta.outputs.date }}
          BUILD_NAME=${{ steps.meta.outputs.name }}
          BUILD_DESCRIPTION=${{ steps.meta.outputs.description }}
          BUILD_REF=${{ github.sha }}
          BUILD_REPOSITORY=${{ github.repository }}
        # The layer cache lives on the same package as the version images,
        # not in the GitHub Actions cache: that one is evicted after 7 days
        # unused and past 10 GB, and every PR writes to it, so a Release
        # that missed it rebuilt layers nobody had asked to change. A
        # rebuild runs `apt-get update` and gets new bytes, so only a cache
        # hit keeps a layer's digest -- and only an unchanged digest spares
        # the host the download (issue #155).
        # The gha cache stays behind it as a fallback read, for the build
        # that finds no :buildcache yet -- the first one after this change
        # -- and for any later miss. Nothing here writes it any more; CI's
        # push-to-main builds are what fill it.
        cache-from: |
          type=registry,ref=${{ inputs.image_base }}-${{ inputs.arch }}:buildcache
          type=gha,scope=${{ inputs.arch }}
        # Written only from main. A manual images-only run on another ref
        # reads the cache but must not publish its own layers as the cache
        # every later Release starts from -- so a version published that
        # way leaves the cache where the last main build put it, and the
        # next build on main refills it.
        cache-to: >-
          ${{ github.ref_name == 'main' && format(
          'type=registry,ref={0}-{1}:buildcache,mode=max,compression=gzip,image-manifest=true,oci-mediatypes=true',
          inputs.image_base, inputs.arch) || '' }}
