---
version: 2
updates:
  # GitHub Actions used by the workflows. One grouped PR per week.
  # The Odoo nightly and the Debian base image are handled by the
  # odoo-bump workflow: Dependabot cannot follow a FROM composed from
  # ARGs (the Dockerfile's BASE_IMAGE_TAG) or the nightly.odoo.com URL
  # scheme.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Taipei
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
  # The composite action used by release.yml lives outside .github/workflows,
  # so it needs its own entry.
  - package-ecosystem: github-actions
    directory: /.github/actions/publish-image
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Taipei
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
